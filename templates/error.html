<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops! Link Não Encontrado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container" style="display: flex; align-items: center; justify-content: center;">
    <div class="card portal-card" style="text-align: center; padding: 3rem 2rem;">
      <div style="width: 80px; height: 80px; background: rgba(244, 63, 94, 0.2); color: #f43f5e; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 1.5rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <h1 style="font-size: 1.6rem; margin-bottom: 0.75rem; color: var(--text-main);">
        Link Inválido ou Expirado
      </h1>
      <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
        {{ mensagem or "O link de recadastro acessado não é válido. Por favor solicite um novo link à administração do estacionamento." }}
      </p>

      <a href="/admin" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Ir para a Administração
      </a>
    </div>
  </div>

</body>
</html>
